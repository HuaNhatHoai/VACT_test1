<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phân tích kiểm tra lần 1 &amp; lần 2 — So sánh thứ hạng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EEF0EA;
    --panel: #FFFFFF;
    --panel-2: #F7F8F4;
    --ink: #1E2A2C;
    --ink-soft: #55666A;
    --ink-faint: #8B9A96;
    --line: #D7DBD2;
    --line-strong: #BEC5BA;

    --navy: #223A52;
    --navy-soft: #DDE4EC;

    --gold: #AD812E;
    --gold-soft: #F1E3C2;
    --gold-strong: #8A6620;

    --red: #A2402F;
    --red-soft: #F1DCD5;
    --red-strong: #7E3021;

    --teal: #3B6357;
    --teal-soft: #DBE7E0;
    --teal-strong: #2B4A41;

    --serif: 'Newsreader', Georgia, serif;
    --sans: 'IBM Plex Sans', -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', monospace;

    --radius-s: 3px;
    --radius-m: 6px;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--gold-soft); }

  a{ color:inherit; }
  table{ border-collapse:collapse; width:100%; }

  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:0 24px;
  }

  /* ---------- MASTHEAD ---------- */
  .masthead{
    background:var(--navy);
    color:#F2F4F1;
    padding:38px 0 30px;
  }
  .masthead .kicker{
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:0.02em;
    color:#B9C6D3;
    margin:0 0 14px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  .masthead .kicker span:not(:last-child)::after{
    content:"·";
    margin-left:10px;
    color:#5C7189;
  }
  .masthead h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(28px,4.4vw,42px);
    line-height:1.1;
    margin:0 0 10px;
    color:#fff;
    max-width:15ch;
  }
  .masthead .sub{
    font-size:15.5px;
    color:#C9D3D9;
    max-width:56ch;
    margin:0 0 28px;
  }

  .stat-strip{
    display:flex;
    flex-wrap:wrap;
    border-top:1px solid #3A5470;
  }
  .stat-strip .stat{
    flex:1 1 140px;
    padding:16px 20px 4px 0;
    border-right:1px solid #3A5470;
    margin-right:20px;
  }
  .stat-strip .stat:last-child{ border-right:none; }
  .stat .stat-label{
    font-size:12px;
    color:#9FB1BE;
    margin-bottom:6px;
  }
  .stat .stat-value{
    font-family:var(--serif);
    font-size:28px;
    font-weight:600;
    color:#fff;
  }
  .stat .stat-value sup{
    font-family:var(--sans);
    font-size:13px;
    font-weight:500;
    color:#9FB1BE;
    margin-left:2px;
  }

  /* ---------- NAV ---------- */
  .subnav{
    position:sticky; top:0; z-index:50;
    background:rgba(238,240,234,0.94);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line-strong);
  }
  .subnav-inner{
    display:flex;
    overflow-x:auto;
    gap:2px;
    -ms-overflow-style:none;
    scrollbar-width:none;
  }
  .subnav-inner::-webkit-scrollbar{ display:none; }
  .subnav a{
    flex:0 0 auto;
    padding:13px 16px;
    font-size:13.5px;
    font-weight:500;
    text-decoration:none;
    color:var(--ink-soft);
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  .subnav a.active{
    color:var(--ink);
    border-bottom-color:var(--gold-strong);
  }

  /* ---------- SECTIONS ---------- */
  section{ padding:44px 0; border-bottom:1px solid var(--line); }
  section:last-of-type{ border-bottom:none; }

  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:20px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .section-head h2{
    font-family:var(--serif);
    font-weight:600;
    font-size:24px;
    margin:0;
    padding-left:14px;
    border-left:4px solid var(--accent, var(--navy));
  }
  .section-head .section-note{
    font-size:13.5px;
    color:var(--ink-soft);
    max-width:40ch;
  }

  #overview{ --accent: var(--navy); }
  #leaderboard{ --accent: var(--gold-strong); }
  #groups{ --accent: var(--teal-strong); }
  #questions{ --accent: var(--red-strong); }
  #lookup{ --accent: var(--navy); }
  #insights{ --accent: var(--gold-strong); }

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
  }

  /* ---------- OVERVIEW GRID ---------- */
  .overview-grid{
    display:grid;
    grid-template-columns: 1.2fr 1fr;
    gap:20px;
  }
  @media (max-width:820px){ .overview-grid{ grid-template-columns:1fr; } }

  .metric-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    overflow:hidden;
    margin-bottom:20px;
  }
  @media (max-width:600px){ .metric-row{ grid-template-columns:repeat(2,1fr); } }
  .metric-row .m{
    padding:16px 16px;
    border-right:1px solid var(--line);
    background:var(--panel);
  }
  .metric-row .m:nth-child(2n){ }
  .metric-row .m:last-child{ border-right:none; }
  .metric-row .m .lbl{ font-size:12px; color:var(--ink-soft); margin-bottom:5px; }
  .metric-row .m .val{ font-family:var(--mono); font-size:21px; font-weight:600; }

  .classify-bars{ padding:20px; }
  .cbar-row{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .cbar-row:last-child{ margin-bottom:0; }
  .cbar-label{ width:96px; font-size:13.5px; flex:0 0 96px; }
  .cbar-track{ flex:1; height:10px; background:var(--panel-2); border-radius:5px; overflow:hidden; }
  .cbar-fill{ height:100%; border-radius:5px; }
  .cbar-count{ width:70px; text-align:right; font-family:var(--mono); font-size:13px; color:var(--ink-soft); flex:0 0 70px; }

  .chart-panel{ padding:18px; }
  .chart-panel h3{
    font-family:var(--serif); font-weight:600; font-size:16px; margin:0 0 4px;
  }
  .chart-panel .chart-sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 14px; }
  .chart-box{ position:relative; }

  /* ---------- LEADERBOARD ---------- */
  .table-tools{
    display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center;
  }
  .search-input{
    font-family:var(--sans);
    font-size:14px;
    padding:9px 12px;
    border:1px solid var(--line-strong);
    border-radius:var(--radius-s);
    background:var(--panel);
    flex:1 1 220px;
    color:var(--ink);
  }
  .search-input:focus{ outline:none; border-color:var(--navy); }
  .tag-filter{
    display:flex; gap:6px; flex-wrap:wrap;
  }
  .tag-btn{
    font-family:var(--sans); font-size:12.5px; font-weight:500;
    padding:7px 12px; border-radius:20px; border:1px solid var(--line-strong);
    background:var(--panel); color:var(--ink-soft); cursor:pointer;
  }
  .tag-btn.active{ background:var(--navy); color:#fff; border-color:var(--navy); }

  .lb-table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-m); }
  table.lb{ min-width:640px; }
  table.lb thead th{
    text-align:left;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    padding:11px 14px;
    background:var(--panel-2);
    border-bottom:1px solid var(--line);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  table.lb thead th .arrow{ opacity:0.35; font-size:10px; margin-left:3px; }
  table.lb thead th.sorted .arrow{ opacity:1; }
  table.lb tbody td{
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
    vertical-align:middle;
  }
  table.lb tbody tr:last-child td{ border-bottom:none; }
  table.lb tbody tr:hover{ background:var(--panel-2); }
  table.lb tbody tr.top3 td:first-child{ border-left:3px solid var(--gold-strong); }
  .rank-num{ font-family:var(--serif); font-size:17px; font-weight:600; color:var(--ink-soft); }
  .rank-num.is-top{ color:var(--gold-strong); }
  .name-cell{ font-weight:500; }
  .score-cell{ font-family:var(--mono); font-weight:600; }
  .score10-cell{ font-family:var(--mono); color:var(--ink-soft); }
  .badge{
    display:inline-block; font-size:11.5px; font-weight:600; padding:3px 9px;
    border-radius:20px; white-space:nowrap;
  }
  .badge.gioi{ background:var(--teal-soft); color:var(--teal-strong); }
  .badge.kha{ background:var(--gold-soft); color:var(--gold-strong); }
  .badge.tb{ background:var(--navy-soft); color:var(--navy); }
  .badge.yeu{ background:var(--red-soft); color:var(--red-strong); }
  .weak-chip{
    font-family:var(--mono); font-size:11.5px; color:var(--ink-soft);
    border:1px solid var(--line-strong); border-radius:4px; padding:2px 6px;
  }
  .lb-name-btn{ background:none; border:none; padding:0; font:inherit; color:inherit; cursor:pointer; text-decoration:underline; text-decoration-color:var(--line-strong); text-underline-offset:3px; }
  .lb-name-btn:hover{ text-decoration-color:var(--ink); }

  /* ---------- GROUPS ---------- */
  .group-list{ display:flex; flex-direction:column; gap:0; margin-bottom:24px; border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden; }
  .group-row{ display:grid; grid-template-columns: 150px 1fr 90px 130px; gap:16px; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  .group-row:last-child{ border-bottom:none; }
  @media (max-width:700px){
    .group-row{ grid-template-columns: 1fr; gap:8px; }
    .group-row .g-track-cell{ order:3; }
    .group-row .g-pct{ order:2; text-align:left; }
    .group-row .g-weak{ order:4; }
  }
  .group-row .g-id{ font-family:var(--serif); font-weight:600; font-size:16px; }
  .group-row .g-desc{ display:block; font-family:var(--sans); font-weight:400; font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .g-track{ height:10px; background:var(--panel-2); border-radius:5px; overflow:hidden; }
  .g-track-fill{ height:100%; border-radius:5px; }
  .g-pct{ font-family:var(--mono); font-weight:600; text-align:right; }
  .g-weak{ font-size:12px; color:var(--ink-soft); text-align:right; }
  .g-weak b{ color:var(--red-strong); font-family:var(--mono); }

  .heatmap-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-m); }
  table.heat{ min-width:620px; font-size:12.5px; }
  table.heat th{ padding:8px 10px; background:var(--panel-2); border-bottom:1px solid var(--line); font-weight:600; color:var(--ink-soft); font-size:11.5px; }
  table.heat th.sticky-col, table.heat td.sticky-col{ position:sticky; left:0; background:var(--panel-2); text-align:left; z-index:2; }
  table.heat td{ text-align:center; padding:7px 8px; border-bottom:1px solid var(--line); font-family:var(--mono); }
  table.heat td.sticky-col{ background:var(--panel); font-family:var(--sans); font-weight:500; white-space:nowrap; }
  table.heat tbody tr:last-child td{ border-bottom:none; }

  /* ---------- QUESTIONS ---------- */
  .q-table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-m); margin-top:20px; }
  table.qt{ min-width:680px; }
  table.qt thead th{ text-align:left; font-size:12px; font-weight:600; color:var(--ink-soft); padding:10px 14px; background:var(--panel-2); border-bottom:1px solid var(--line); cursor:pointer; white-space:nowrap; }
  table.qt tbody td{ padding:9px 14px; border-bottom:1px solid var(--line); font-size:13.5px; }
  table.qt tbody tr:last-child td{ border-bottom:none; }
  table.qt tbody tr:hover{ background:var(--panel-2); }
  .qnum{ font-family:var(--mono); font-weight:600; }
  .diff-tag{ font-size:11px; font-weight:600; padding:3px 8px; border-radius:4px; }
  .diff-tag.hard{ background:var(--red-soft); color:var(--red-strong); }
  .diff-tag.mid{ background:var(--gold-soft); color:var(--gold-strong); }
  .diff-tag.easy{ background:var(--teal-soft); color:var(--teal-strong); }
  .distractor{ font-family:var(--mono); font-size:12.5px; color:var(--ink-soft); }

  .callout-pair{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:22px; }
  @media (max-width:700px){ .callout-pair{ grid-template-columns:1fr; } }
  .callout{ border:1px solid var(--line); border-radius:var(--radius-m); padding:18px; background:var(--panel); }
  .callout h4{ font-family:var(--serif); font-size:15px; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .callout .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
  .callout ol{ margin:0; padding-left:18px; font-size:13.5px; }
  .callout li{ margin-bottom:8px; }
  .callout li:last-child{ margin-bottom:0; }
  .callout .qmeta{ color:var(--ink-soft); font-size:12px; }

  /* ---------- LOOKUP ---------- */
  .lookup-picker{ margin-bottom:24px; }
  select#studentSelect{
    font-family:var(--sans); font-size:14.5px; padding:10px 14px;
    border:1px solid var(--line-strong); border-radius:var(--radius-s);
    background:var(--panel); width:100%; max-width:420px; color:var(--ink);
  }
  .profile-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:22px; }
  @media (max-width:820px){ .profile-grid{ grid-template-columns:1fr; } }
  .profile-card{ padding:20px; }
  .profile-name{ font-family:var(--serif); font-size:21px; font-weight:600; margin:0 0 4px; }
  .profile-meta{ font-size:13px; color:var(--ink-soft); margin-bottom:18px; }
  .profile-stats{ display:flex; gap:20px; margin-bottom:18px; flex-wrap:wrap; }
  .profile-stats .ps{ }
  .profile-stats .ps .lbl{ font-size:11.5px; color:var(--ink-soft); }
  .profile-stats .ps .val{ font-family:var(--mono); font-size:19px; font-weight:600; }
  .rec-box{ background:var(--panel-2); border-radius:var(--radius-s); padding:14px 16px; font-size:13.5px; border-left:3px solid var(--gold-strong); }
  .rec-box b{ color:var(--red-strong); }

  .wrong-list{ margin-top:18px; }
  .wrong-list h4{ font-family:var(--serif); font-size:15px; margin:0 0 10px; }
  .wrong-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .wrong-chip{
    font-family:var(--mono); font-size:12px; border:1px solid var(--red-soft);
    background:var(--red-soft); color:var(--red-strong); border-radius:5px; padding:5px 9px;
  }
  .no-wrong{ font-size:13.5px; color:var(--ink-soft); font-style:italic; }

  /* ---------- INSIGHTS ---------- */
  .insight-list{ display:flex; flex-direction:column; gap:14px; }
  .insight-item{ display:flex; gap:14px; padding:16px 18px; border:1px solid var(--line); border-radius:var(--radius-m); background:var(--panel); }
  .insight-item .idx{ font-family:var(--serif); font-size:19px; font-weight:600; color:var(--ink-faint); flex:0 0 auto; }
  .insight-item p{ margin:0; font-size:14px; }
  .insight-item strong{ color:var(--red-strong); }
  .insight-item em{ color:var(--teal-strong); font-style:normal; font-weight:600; }

  footer{ padding:26px 0 40px; text-align:center; font-size:12.5px; color:var(--ink-faint); }

  @media (max-width:600px){
    .wrap{ padding:0 16px; }
    .masthead{ padding:28px 0 22px; }
    section{ padding:32px 0; }
  }

:root{ --tabh:48px; }
.tabbar{ position:sticky; top:0; z-index:60; background:#182B3F; height:var(--tabh); border-bottom:1px solid #3A5470; }
.tabbar-inner{ display:flex; gap:4px; height:100%; align-items:stretch; }
.tabbar button{ background:none; border:none; color:#B9C6D3; font:500 14px var(--sans); padding:0 18px; cursor:pointer; border-bottom:3px solid transparent; }
.tabbar button:hover{ color:#fff; }
.tabbar button.active{ color:#fff; border-bottom-color:var(--gold); }
.tabpane{ display:none; }
.tabpane.active{ display:block; }
.subnav{ top:var(--tabh); }
section{ scroll-margin-top:110px; }
.masthead h1{ max-width:26ch; }
table.cmp{ min-width:660px; font-size:13.5px; }
table.cmp th{ padding:11px 14px; text-align:left; font-size:12px; font-weight:600; color:var(--ink-soft); background:var(--panel-2); border-bottom:1px solid var(--line-strong); white-space:nowrap; }
table.cmp th.sortable{ cursor:pointer; user-select:none; }
table.cmp th.sorted{ color:var(--ink); }
table.cmp td{ padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel); }
table.cmp tr:last-child td{ border-bottom:none; }
table.cmp tbody tr:hover td{ background:var(--panel-2); }
table.cmp .num{ text-align:right; font-family:var(--mono); }
table.cmp small{ color:var(--ink-faint); font-size:11px; margin-left:4px; }
.alias{ display:block; font-size:11.5px; color:var(--ink-faint); }
.chg{ display:inline-block; font-family:var(--mono); font-weight:600; font-size:12.5px; padding:2px 9px; border-radius:var(--radius-s); }
.chg.up{ background:var(--teal-soft); color:var(--teal-strong); }
.chg.down{ background:var(--red-soft); color:var(--red-strong); }
.chg.same{ background:var(--panel-2); color:var(--ink-soft); }
.dpos{ color:var(--teal-strong); } .dneg{ color:var(--red-strong); }
.legend-dots{ display:flex; gap:16px; font-size:12.5px; color:var(--ink-soft); margin:0 0 12px; }
.legend-dots i{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; }
</style>
</head>
<body>
<div class="tabbar"><div class="wrap tabbar-inner" id="tabbar">
  <button data-tab="cmp" class="active">So sánh 2 lần</button>
  <button data-tab="t1">Lần 1</button>
  <button data-tab="t2">Lần 2</button>
</div></div>
<div class="tabpane active" id="pane-cmp"></div>

<script>
function buildDashboard(DATA, app){
  "use strict";
  function $id(i){ return app.querySelector('[id="'+i+'"]'); }
  var COL = {
    navy:'#223A52', navySoft:'#DDE4EC',
    gold:'#AD812E', goldSoft:'#F1E3C2', goldStrong:'#8A6620',
    red:'#A2402F', redSoft:'#F1DCD5', redStrong:'#7E3021',
    teal:'#3B6357', tealSoft:'#DBE7E0', tealStrong:'#2B4A41',
    inkSoft:'#55666A', line:'#D7DBD2'
  };

  var CLASS_KEY = { 'Giỏi':'gioi', 'Khá':'kha', 'Trung bình':'tb', 'Yếu':'yeu' };
  var CLASS_COLOR = { 'Giỏi':COL.teal, 'Khá':COL.gold, 'Trung bình':COL.navy, 'Yếu':COL.red };
  var CLASS_ORDER = ['Giỏi','Khá','Trung bình','Yếu'];

  var groupMap = {};
  DATA.groups.forEach(function(g){ groupMap[g.id]=g; });

  function perfColor(pct){
    if (pct < 40) return COL.red;
    if (pct < 70) return COL.gold;
    return COL.teal;
  }
  function perfColorSoft(pct){
    if (pct < 40) return COL.redSoft;
    if (pct < 70) return COL.goldSoft;
    return COL.tealSoft;
  }
  function diffTag(pct){
    if (pct < 40) return {cls:'hard', label:'Khó'};
    if (pct < 70) return {cls:'mid', label:'Trung bình'};
    return {cls:'easy', label:'Dễ'};
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---------------- LIGHTWEIGHT SVG CHARTS (no external libraries) ---------------- */
  function niceMax(v){
    if (v<=0) return 1;
    var mag = Math.pow(10, Math.floor(Math.log(v)/Math.LN10));
    var n = v/mag;
    var step = n<=1?1:n<=2?2:n<=5?5:10;
    return step*mag;
  }

  function barChartSVG(items, opts){
    opts = opts || {};
    var W = opts.width || 640, H = opts.height || 230;
    var padL = opts.padL != null ? opts.padL : 30, padR = 10, padT = 14;
    var padB = opts.padB != null ? opts.padB : 30;
    var yMax = opts.yMax || niceMax(Math.max.apply(null, items.map(function(d){return d.value;})) || 1);
    var innerW = W-padL-padR, innerH = H-padT-padB;
    var n = items.length;
    var gap = opts.gap != null ? opts.gap : innerW/n*0.32;
    var bw = (innerW - gap*(n-1))/n;
    var yTicks = opts.yTicks || 4;
    var fmt = opts.yFormat || function(v){ return v; };

    var svg = '<svg viewBox="0 0 '+W+' '+H+'" width="'+(opts.fixedWidth?W:'100%')+'" height="'+(opts.fixedWidth?H:'auto')+'" role="img" aria-label="'+(opts.ariaLabel||'')+'" style="font-family:var(--sans);display:block;">';

    // gridlines + y labels
    for (var t=0; t<=yTicks; t++){
      var val = yMax/yTicks*t;
      var y = padT + innerH - (val/yMax)*innerH;
      svg += '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#E4E7DF" stroke-width="1"/>';
      svg += '<text x="'+(padL-8)+'" y="'+(y+3)+'" text-anchor="end" font-size="9.5" fill="'+COL.inkSoft+'">'+fmt(val)+'</text>';
    }
    // baseline
    svg += '<line x1="'+padL+'" y1="'+(padT+innerH)+'" x2="'+(W-padR)+'" y2="'+(padT+innerH)+'" stroke="'+COL.line+'" stroke-width="1"/>';

    items.forEach(function(d,i){
      var x = padL + i*(bw+gap);
      var h = Math.max((d.value/yMax)*innerH, d.value>0?2:0);
      var y = padT + innerH - h;
      var title = d.title || (d.label+': '+d.value);
      svg += '<g>'+
        '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="'+d.color+'">'+
          '<title>'+esc(title)+'</title>'+
        '</rect>';
      if (opts.showValue){
        svg += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle" font-size="10" font-weight="600" fill="'+d.color+'">'+d.value+(opts.valueSuffix||'')+'</text>';
      }
      if (d.label!=null && (!opts.labelEvery || i%opts.labelEvery===0)){
        var labelLines = String(d.label).split('\n');
        labelLines.forEach(function(line,li){
          svg += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(padT+innerH+16+li*11).toFixed(1)+'" text-anchor="middle" font-size="'+(opts.labelSize||10.5)+'" fill="'+COL.inkSoft+'">'+esc(line)+'</text>';
        });
      }
      svg += '</g>';
    });
    svg += '</svg>';
    return svg;
  }

  // Radar / spider chart. axes: [{key,label}], series: [{values:[...], color, dashed, fillOpacity}]
  function radarChartSVG(axes, series, opts){
    opts = opts || {};
    var size = opts.size || 300;
    var cx = size/2, cy = size/2;
    var r = size*0.34;
    var n = axes.length;
    var rings = opts.rings || 4;
    var max = opts.max || 100;

    function pt(i, val){
      var ang = -Math.PI/2 + i*(2*Math.PI/n);
      var rad = (val/max)*r;
      return [cx + rad*Math.cos(ang), cy + rad*Math.sin(ang)];
    }

    var svg = '<svg viewBox="0 0 '+size+' '+size+'" width="100%" height="auto" style="display:block;max-width:340px;margin:0 auto;font-family:var(--sans);">';

    // rings
    for (var ri=1; ri<=rings; ri++){
      var rr = r*ri/rings;
      var pts = [];
      for (var i=0;i<n;i++){
        var ang = -Math.PI/2 + i*(2*Math.PI/n);
        pts.push((cx+rr*Math.cos(ang)).toFixed(1)+','+(cy+rr*Math.sin(ang)).toFixed(1));
      }
      svg += '<polygon points="'+pts.join(' ')+'" fill="none" stroke="#E4E7DF" stroke-width="1"/>';
    }
    // axes lines + labels
    for (i=0;i<n;i++){
      var p = pt(i, max);
      svg += '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="#E4E7DF" stroke-width="1"/>';
      var lp = pt(i, max*1.16);
      svg += '<text x="'+lp[0].toFixed(1)+'" y="'+lp[1].toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="600" fill="'+COL.inkSoft+'">'+esc(axes[i].label)+'</text>';
    }
    // series
    series.forEach(function(s){
      var pts = s.values.map(function(v,i){ return pt(i,v); });
      var ptsStr = pts.map(function(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
      svg += '<polygon points="'+ptsStr+'" fill="'+s.color+'" fill-opacity="'+(s.fillOpacity!=null?s.fillOpacity:0.18)+'" stroke="'+s.color+'" stroke-width="2" '+(s.dashed?'stroke-dasharray="5,4"':'')+'/>';
      if (!s.dashed) pts.forEach(function(p){ svg += '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="'+s.color+'"/>'; });
    });
    svg += '</svg>';

    // legend
    var legend = '<div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:10px;">'+
      series.map(function(s){
        return '<span style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:'+COL.inkSoft+';">'+
          '<span style="width:14px;height:0;border-top:3px '+(s.dashed?'dashed':'solid')+' '+s.color+';display:inline-block;"></span>'+esc(s.label)+
        '</span>';
      }).join('')+
    '</div>';
    return svg + legend;
  }

      '<div id="studentProfile"></div>';
  }

  function renderStudentProfile(name){
    var box = $id('studentProfile');
    if (!box) return;
    if (!name){ box.innerHTML=''; return; }
    var s = DATA.students.filter(function(x){ return x.name===name; })[0];
    if (!s){ box.innerHTML=''; return; }

    var wg = groupMap[s.weakest_group];
    var wrongQs = [];
    s.correct.forEach(function(c,i){
      if (!c) wrongQs.push({ num:i+1, given:s.answers[i]||'—', ans:DATA.key[i] });
    });

    var wrongHTML = wrongQs.length
      ? '<div class="wrong-chips">'+wrongQs.map(function(w){ return '<span class="wrong-chip">Câu '+w.num+': chọn '+w.given+' (đúng: '+w.ans+')</span>'; }).join('')+'</div>'
      : '<p class="no-wrong">Không có câu sai — làm đúng toàn bộ bài thi.</p>';

    box.innerHTML =
      '<div class="profile-grid">'+
        '<div class="panel profile-card">'+
          '<p class="profile-name">'+esc(s.name)+'</p>'+
          '<p class="profile-meta">Hạng '+s.rank+' / '+DATA.meta.n_students+' · Xếp loại '+s.classification+'</p>'+
          '<div class="profile-stats">'+
            '<div class="ps"><div class="lbl">Số câu đúng</div><div class="val">'+s.score+'/'+DATA.meta.n_questions+'</div></div>'+
            '<div class="ps"><div class="lbl">Điểm /10</div><div class="val">'+s.score10.toFixed(2)+'</div></div>'+
          '</div>'+
          '<div class="rec-box">Nhóm cần ôn tập trọng tâm: <b>'+wg.label+' ('+wg.desc+')</b> — chỉ đúng '+s.group_scores[s.weakest_group].pct+'% câu trong nhóm này.</div>'+
          '<div class="wrong-list"><h4>Danh sách câu sai ('+wrongQs.length+' câu)</h4>'+wrongHTML+'</div>'+
        '</div>'+
        '<div class="panel chart-panel"><h3>Tỉ lệ đúng theo nhóm so với lớp</h3><p class="chart-sub">So sánh học sinh này với mức trung bình của cả lớp</p><div class="chart-box" id="radarChart"></div></div>'+
      '</div>';

    var radarBox = $id('radarChart');
    if (radarBox) {
      radarBox.innerHTML = radarChartSVG(
        DATA.groups.map(function(g){ return { key:g.id, label:g.id }; }),
        [
          { label:s.name, values: DATA.groups.map(function(g){ return s.group_scores[g.id].pct; }), color:COL.navy, fillOpacity:0.22 },
          { label:'Trung bình lớp', values: DATA.groups.map(function(g){ return g.avg_pct; }), color:COL.inkSoft, dashed:true, fillOpacity:0 }
        ]
      );
    }
  }

  /* ---------------- INSIGHTS ---------------- */
  function insightsHTML(){
    var m = DATA.meta;
    var weakest = groupMap[DATA.class_weakest];
    var strongest = groupMap[DATA.class_strongest];
    var mostWeakGroup = Object.keys(DATA.weak_group_count).sort(function(a,b){ return DATA.weak_group_count[b]-DATA.weak_group_count[a]; })[0];
    var mwg = groupMap[mostWeakGroup];
    var yeuList = DATA.students.filter(function(s){ return s.classification==='Yếu'; }).sort(function(a,b){ return a.score-b.score; });
    var h1 = DATA.hardest5[0], h2 = DATA.hardest5[1];

    var items = [
      'Điểm trung bình toàn lớp là <strong>'+m.mean+'/'+m.n_questions+'</strong> (tương đương <strong>'+m.mean10+'/10</strong>), với độ lệch chuẩn '+(m.stdev/m.n_questions>0.15?'khá lớn':'ở mức vừa phải')+' (<strong>'+m.stdev+'</strong>) cho thấy học lực giữa các học sinh trong lớp '+(m.stdev/m.n_questions>0.15?'chưa đồng đều.':'tương đối đồng đều.')+'',
      'Xét theo nhóm chuyên đề, <em>'+weakest.label+' ('+weakest.desc+')</em> là nhóm lớp làm yếu nhất với chỉ <strong>'+weakest.avg_pct+'%</strong> câu đúng trung bình, nên được ưu tiên ôn tập lại trước các nhóm khác.',
      'Ngược lại, <em>'+strongest.label+' ('+strongest.desc+')</em> là nhóm lớp nắm vững nhất với <strong>'+strongest.avg_pct+'%</strong> câu đúng — có thể dùng làm nền tảng liên hệ khi ôn các nhóm còn yếu.',
      'Nhóm <em>'+mwg.label+' ('+mwg.desc+')</em> là nhóm có nhiều học sinh xem là "yếu nhất" của bản thân nhất — <strong>'+DATA.weak_group_count[mostWeakGroup]+'/'+m.n_students+' học sinh</strong> có đây là nhóm điểm thấp nhất trong bài làm của mình.',
      'Câu '+h1.num+' và câu '+h2.num+' là hai câu khó nhất đề thi, chỉ lần lượt <strong>'+h1.pct_correct+'%</strong> và <strong>'+h2.pct_correct+'%</strong> học sinh trả lời đúng — nên xem lại cách ra đề hoặc dành thời gian giảng lại kiến thức liên quan.',
      'Có <strong>'+yeuList.length+' học sinh</strong> xếp loại Yếu (dưới 5/10 điểm), cần được hỗ trợ ôn tập sớm: '+yeuList.slice(0,6).map(function(s){ return esc(s.name); }).join(', ')+(yeuList.length>6?', …':'')+'.'
    ];

    return '<div class="insight-list">'+items.map(function(txt,i){
      return '<div class="insight-item"><span class="idx">'+String(i+1).padStart(2,'0')+'</span><p>'+txt+'</p></div>';
    }).join('')+'</div>';
  }

  /* ---------------- EVENTS ---------------- */
  function initEvents(){
    $id('lbSearch').addEventListener('input', function(e){
      lbSearch = e.target.value; renderLeaderboard();
    });
    $id('lbFilter').addEventListener('click', function(e){
      var btn = e.target.closest('.tag-btn'); if(!btn) return;
      app.querySelectorAll('#lbFilter .tag-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      lbFilter = btn.getAttribute('data-f'); renderLeaderboard();
    });
    app.querySelectorAll('table.lb thead th').forEach(function(el){
      el.addEventListener('click', function(){
        var key = el.getAttribute('data-key');
        if (lbSort.key===key) lbSort.dir *= -1; else { lbSort.key=key; lbSort.dir = (key==='name'||key==='classification'||key==='weakest_group') ? 1 : -1; }
        renderLeaderboard();
      });
    });
    $id('lbBody').addEventListener('click', function(e){
      var btn = e.target.closest('.lb-name-btn'); if(!btn) return;
      var name = btn.getAttribute('data-name');
      $id('studentSelect').value = name;
      renderStudentProfile(name);
      var lookupSec = $id('lookup');
      if (lookupSec.scrollIntoView) lookupSec.scrollIntoView({behavior:'smooth', block:'start'});
    });
    app.querySelectorAll('table.qt thead th').forEach(function(el){
      el.addEventListener('click', function(){
        var key = el.getAttribute('data-key');
        if (qSort.key===key) qSort.dir *= -1; else { qSort.key=key; qSort.dir = key==='num' ? 1 : -1; }
        renderQuestions();
      });
    });
    $id('studentSelect').addEventListener('change', function(e){
      renderStudentProfile(e.target.value);
    });

    app.querySelectorAll('.subnav a').forEach(function(a){
      a.addEventListener('click', function(e){ e.preventDefault(); var t=app.querySelector(a.getAttribute('href')); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); });
    });
    // scrollspy for subnav
    var navLinks = Array.prototype.slice.call(app.querySelectorAll('.subnav a'));
    var sections = navLinks.map(function(a){ return app.querySelector(a.getAttribute('href')); });
    window.addEventListener('scroll', function(){
      var pos = window.scrollY + 150;
      var activeIdx = 0;
      sections.forEach(function(sec,i){ if (sec && sec.offsetTop <= pos) activeIdx = i; });
      navLinks.forEach(function(a,i){ a.classList.toggle('active', i===activeIdx); });
    }, { passive:true });
  }

  renderLeaderboard();
  renderQuestions();
  initEvents();
  renderHistChart();
  renderGroupChart();
  renderQChart();
}

function buildCompare(app, D1, D2, C){
  var M=C.matched, ORDER=['Giỏi','Khá','Trung bình','Yếu'];
  var CC={'Giỏi':'#3B6357','Khá':'#AD812E','Trung bình':'#223A52','Yếu':'#A2402F'};
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function sg(v,d){ return (v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(d); }
  function cls(v){ return v>0?'dpos':v<0?'dneg':''; }
  var up=M.filter(function(r){return r.dr>0;}).length, dn=M.filter(function(r){return r.dr<0;}).length, same=M.length-up-dn;
  function stat(l,v){ return '<div class="stat"><div class="stat-label">'+l+'</div><div class="stat-value">'+v+'</div></div>'; }
  function section(id,t,n,b){ return '<section id="'+id+'"><div class="section-head"><h2>'+t+'</h2><p class="section-note">'+n+'</p></div>'+b+'</section>'; }
  function chg(dr){ return dr>0?'<span class="chg up">▲ '+dr+'</span>':dr<0?'<span class="chg down">▼ '+(-dr)+'</span>':'<span class="chg same">＝ 0</span>'; }

  var o1=C.o1,o2=C.o2;
  function row(l,a,b,d){ return '<tr><td>'+l+'</td><td class="num">'+a+'</td><td class="num">'+b+'</td><td class="num">'+(d==null?'—':d)+'</td></tr>'; }
  function drow(l,a,b){ var d=Math.round((b-a)*100)/100; return row(l,a.toFixed(2),b.toFixed(2),'<span class="'+cls(d)+'">'+sg(d,2)+'</span>'); }
  var tbl='<div class="lb-table-wrap"><table class="cmp"><thead><tr><th>Chỉ số (cả lớp)</th><th class="num">Lần 1</th><th class="num">Lần 2</th><th class="num">Chênh lệch</th></tr></thead><tbody>'+
    row('Số học sinh dự thi',o1.n,o2.n,null)+row('Số câu hỏi',o1.nq,o2.nq,null)+
    drow('Điểm trung bình /10',o1.mean10,o2.mean10)+drow('Trung vị /10',o1.median10,o2.median10)+
    drow('Cao nhất /10',o1.max10,o2.max10)+drow('Thấp nhất /10',o1.min10,o2.min10)+drow('Độ lệch chuẩn /10',o1.std10,o2.std10)+
    '</tbody></table></div>';
  var bars='<div class="panel classify-bars"><div class="legend-dots"><span><i style="background:#223A52"></i>Lần 1</span><span><i style="background:#AD812E"></i>Lần 2</span></div>';
  ORDER.forEach(function(k){
    var a=o1.dist[k]||0,b=o2.dist[k]||0,pa=Math.round(a/o1.n*100),pb=Math.round(b/o2.n*100);
    bars+='<div class="cbar-row"><div class="cbar-label">'+k+'</div><div class="cbar-track"><div class="cbar-fill" style="width:'+pa+'%;background:#223A52"></div></div><div class="cbar-count" style="width:96px">'+a+' HS ('+pa+'%)</div></div>'+
          '<div class="cbar-row"><div class="cbar-label"></div><div class="cbar-track"><div class="cbar-fill" style="width:'+pb+'%;background:#AD812E"></div></div><div class="cbar-count" style="width:96px">'+b+' HS ('+pb+'%)</div></div>';
  });
  bars+='</div>';
  var overview='<div class="overview-grid">'+tbl+bars+'</div>'+
    '<p class="chart-sub" style="margin-top:14px">Điểm hai lần được quy về thang 10 để so sánh (lần 1: 30 câu, lần 2: 15 câu). Xếp loại theo cùng ngưỡng: Giỏi ≥ 8 · Khá ≥ 6.5 · TB ≥ 5 · Yếu &lt; 5.</p>';

  var ranks='<div class="table-tools"><input type="text" class="search-input" id="cSearch" placeholder="Tìm theo tên học sinh…"><div class="tag-filter" id="cFilter">'+
    '<button class="tag-btn active" data-f="all">Tất cả ('+M.length+')</button><button class="tag-btn" data-f="up">Tăng hạng ('+up+')</button><button class="tag-btn" data-f="down">Giảm hạng ('+dn+')</button><button class="tag-btn" data-f="same">Giữ hạng ('+same+')</button></div></div>'+
    '<div class="lb-table-wrap"><table class="cmp" id="cTable"><thead><tr>'+
    [['n2','Học sinh',0],['t1','Điểm /10 · L1',1],['t2','Điểm /10 · L2',1],['dt','Δ điểm',1],['r1','Hạng L1',1],['r2','Hạng L2',1],['dr','Thay đổi hạng',1]].map(function(c){return '<th class="sortable'+(c[2]?' num':'')+'" data-key="'+c[0]+'">'+c[1]+'<span class="arrow"></span></th>';}).join('')+
    '</tr></thead><tbody id="cBody"></tbody></table></div>'+
    '<p class="chart-sub" style="margin-top:12px">Thay đổi hạng = Hạng L1 − Hạng L2 (▲ là tăng hạng). Hạng tính trong '+M.length+' học sinh dự thi cả hai lần; đồng điểm thì đồng hạng.</p>';

  var top=M.slice().sort(function(a,b){return b.dr-a.dr||b.dt-a.dt;}).filter(function(r){return r.dr>0;}).slice(0,3);
  var bot=M.slice().sort(function(a,b){return a.dr-b.dr||a.dt-b.dt;}).filter(function(r){return r.dr<0;}).slice(0,3);
  function li(r){ return '<li>'+esc(r.n2)+' <span class="qmeta">— hạng '+r.r1+' → '+r.r2+' · điểm '+r.t1.toFixed(2)+' → '+r.t2.toFixed(2)+'</span></li>'; }
  var byDt=M.slice().sort(function(a,b){return b.dt-a.dt;}), bestDt=byDt[0], worstDt=byDt[byDt.length-1];
  var dtUp=M.filter(function(r){return r.dt>0;}).length, dtDn=M.filter(function(r){return r.dt<0;}).length;
  var dm=Math.round((C.m2-C.m1)*100)/100;
  var items=[
    'Trong <strong>'+M.length+'</strong> học sinh dự thi cả hai lần, điểm trung bình thang 10 đổi từ <strong>'+C.m1.toFixed(2)+'</strong> sang <strong>'+C.m2.toFixed(2)+'</strong> (<strong>'+sg(dm,2)+'</strong>); có '+dtUp+' em tăng điểm, '+dtDn+' em giảm điểm.',
    'Về thứ hạng: <em>'+up+' em tăng hạng</em>, <em>'+dn+' em giảm hạng</em>, '+same+' em giữ nguyên. Tăng nhiều nhất: <strong>'+(top[0]?esc(top[0].n2)+' (▲'+top[0].dr+')':'—')+'</strong>; giảm nhiều nhất: <strong>'+(bot[0]?esc(bot[0].n2)+' (▼'+(-bot[0].dr)+')':'—')+'</strong>.',
    'Điểm thang 10 tiến bộ nhiều nhất là <em>'+esc(bestDt.n2)+'</em> ('+sg(bestDt.dt,2)+' điểm); giảm nhiều nhất là <em>'+esc(worstDt.n2)+'</em> ('+sg(worstDt.dt,2)+' điểm).',
    'Số học sinh xếp loại Giỏi đổi từ <strong>'+(o1.dist['Giỏi']||0)+'</strong> (lần 1) sang <strong>'+(o2.dist['Giỏi']||0)+'</strong> (lần 2); xếp loại Yếu từ <strong>'+(o1.dist['Yếu']||0)+'</strong> sang <strong>'+(o2.dist['Yếu']||0)+'</strong>.'
  ];
  if (C.only1.length) items.push('Có <strong>'+C.only1.length+'</strong> học sinh dự lần 1 nhưng không có trong bảng điểm lần 2 (chưa so sánh được): '+C.only1.map(function(o){return esc(o.name);}).join(', ')+'.');
  if (C.only2.length) items.push('Có <strong>'+C.only2.length+'</strong> học sinh chỉ xuất hiện ở lần 2: '+C.only2.map(function(o){return esc(o.name);}).join(', ')+'.');
  var hl='<div class="callout-pair"><div class="callout"><h4><span class="dot" style="background:#3B6357"></span>Tăng hạng nhiều nhất</h4><ol>'+(top.map(li).join('')||'<li>—</li>')+'</ol></div>'+
    '<div class="callout"><h4><span class="dot" style="background:#A2402F"></span>Giảm hạng nhiều nhất</h4><ol>'+(bot.map(li).join('')||'<li>—</li>')+'</ol></div></div>'+
    '<div class="insight-list" style="margin-top:22px">'+items.map(function(t,i){return '<div class="insight-item"><span class="idx">'+String(i+1).padStart(2,'0')+'</span><p>'+t+'</p></div>';}).join('')+'</div>';

  var alias=C.alias.map(function(p){return esc(p[0])+' ↔ '+esc(p[1]);}).join('; ');
  var notes=[
    '<strong>Quy đổi điểm:</strong> mọi so sánh dùng điểm thang 10 (số câu đúng ÷ số câu × 10) vì hai đề có số câu khác nhau.',
    '<strong>Xếp hạng:</strong> chỉ xét '+M.length+' học sinh có mặt ở cả hai lần nên có thể khác cột “Hạng” trong từng tab; đồng điểm thì đồng hạng (1, 2, 2, 4…).',
    '<strong>Ghép tên:</strong> hai bảng ghi tên không hoàn toàn giống nhau, nên các cặp sau được ghép thủ công theo tên gần giống — hãy kiểm tra lại nếu có nhầm: '+alias+'.',
    '<strong>Nhóm nội dung lần 2:</strong> 3 nhóm — Lượng giác (câu 1–5), Dãy số (câu 6–10), Giới hạn, tiệm cận (câu 11–15). Lần 1 có 7 nhóm khác nên không so sánh theo nhóm.',
    '<strong>Câu bỏ trống</strong> được tính là sai.'
  ];
  var nt='<div class="insight-list">'+notes.map(function(t,i){return '<div class="insight-item"><span class="idx">'+String(i+1).padStart(2,'0')+'</span><p>'+t+'</p></div>';}).join('')+'</div>';

  app.innerHTML=
    '<header class="masthead"><div class="wrap"><p class="kicker"><span>SO SÁNH HAI LẦN KIỂM TRA</span><span>Lần 1: '+o1.nq+' câu</span><span>Lần 2: '+o2.nq+' câu</span><span>'+M.length+' học sinh dự thi cả hai lần</span></p>'+
    '<h1>So sánh kết quả và thứ hạng sau hai lần kiểm tra</h1><p class="sub">Đối chiếu điểm quy đổi thang 10 và thứ hạng của từng học sinh giữa lần 1 và lần 2.</p>'+
    '<div class="stat-strip">'+stat('ĐTB /10 lần 1',C.m1.toFixed(2))+stat('ĐTB /10 lần 2',C.m2.toFixed(2))+stat('Tăng hạng',up)+stat('Giảm hạng',dn)+stat('Giữ hạng',same)+'</div></div></header>'+

    section('c-ranks','Thay đổi thứ hạng từng học sinh','Bấm tiêu đề cột để sắp xếp; lọc theo tăng/giảm hạng.',ranks)+
    section('c-hl','Nổi bật & nhận xét','Những biến động đáng chú ý giữa hai lần.',hl)+
    section('c-notes','Ghi chú dữ liệu','Cách tính và các giả định đã dùng.',nt)+'</main>'+
    '<footer>So sánh '+M.length+' học sinh dự thi cả hai lần · Lần 1: '+o1.n+' học sinh · Lần 2: '+o2.n+' học sinh</footer>';

  var st={key:'r2',dir:1,f:'all',q:''};
  function q(sel){ return app.querySelector(sel); }
  function render(){

    rows.sort(function(a,b){ var x=a[st.key],y=b[st.key]; if(typeof x==='string') return x.localeCompare(y,'vi')*st.dir; return (x-y)*st.dir||a.r2-b.r2; });
    q('#cBody').innerHTML=rows.map(function(r){

        '<td class="num">'+r.t1.toFixed(2)+'<small>'+r.s1+'/'+o1.nq+'</small></td><td class="num">'+r.t2.toFixed(2)+'<small>'+r.s2+'/'+o2.nq+'</small></td>'+
        '<td class="num '+cls(r.dt)+'">'+sg(r.dt,2)+'</td><td class="num">'+r.r1+'</td><td class="num">'+r.r2+'</td><td class="num">'+chg(r.dr)+'</td></tr>';
    }).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--ink-soft)">Không tìm thấy học sinh phù hợp.</td></tr>';
    app.querySelectorAll('#cTable th').forEach(function(th){ var on=th.getAttribute('data-key')===st.key; th.classList.toggle('sorted',on); th.querySelector('.arrow').textContent=on?(st.dir===1?' ▴':' ▾'):''; });
  }
  q('#cSearch').addEventListener('input',function(e){ st.q=e.target.value.toLowerCase().trim(); render(); });
  q('#cFilter').addEventListener('click',function(e){ var b=e.target.closest('.tag-btn'); if(!b) return; app.querySelectorAll('#cFilter .tag-btn').forEach(function(x){x.classList.remove('active');}); b.classList.add('active'); st.f=b.getAttribute('data-f'); render(); });
  app.querySelectorAll('#cTable th').forEach(function(th){ th.addEventListener('click',function(){ var k=th.getAttribute('data-key'); if(st.key===k) st.dir*=-1; else { st.key=k; st.dir=(k==='n2'||k==='r1'||k==='r2')?1:-1; } render(); }); });
  app.querySelectorAll('.subnav a').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); var t=q(a.getAttribute('href')); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); }); });
  var links=Array.prototype.slice.call(app.querySelectorAll('.subnav a')), secs=links.map(function(a){return q(a.getAttribute('href'));});
  window.addEventListener('scroll',function(){ var pos=window.scrollY+150, ai=0; secs.forEach(function(s,i){ if(s&&s.offsetTop<=pos) ai=i; }); links.forEach(function(a,i){ a.classList.toggle('active',i===ai); }); },{passive:true});
  render();
}

(function(){
  var L1=JSON.parse(document.getElementById('data-l1').textContent);
  var L2=JSON.parse(document.getElementById('data-l2').textContent);
  var CMP=JSON.parse(document.getElementById('data-cmp').textContent);
  L1.meta.title='Lần 1'; L2.meta.title='Lần 2';
  buildDashboard(L1, document.getElementById('pane-t1'));
  buildDashboard(L2, document.getElementById('pane-t2'));
  buildCompare(document.getElementById('pane-cmp'), L1, L2, CMP);
  document.getElementById('tabbar').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#tabbar button').forEach(function(x){ x.classList.toggle('active',x===b); });
    document.querySelectorAll('.tabpane').forEach(function(p){ p.classList.toggle('active',p.id==='pane-'+b.getAttribute('data-tab')); });
    window.scrollTo(0,0);
  });
})();
</script>
</body>
</html>
